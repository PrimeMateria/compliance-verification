# ------------------------------------------------------------------------------
# Formal Domain Controls & Falsifiability Witnesses (L0 -> L1 Seam)
# MUST yield 'rejected' under a valid structural mutation recipe.
# ------------------------------------------------------------------------------

[formal_kernel_witnesses.W-SI71-01]
control_id = "SI-7(1)"
target_theorem = "hybrid_third_deriv_in_bounds"
target_tool = "lean4"
source_path = "source/lean/PRIME/HybridThirdDeriv.lean"
witness_path = "evidence/attestations/witnesses/W_SI71_01_false.lean"
theorem_ast_sha256 = "c3ab8ff13720e8ad9047dd39466b3c8974e592c2fa383d4a3960714caef0c4f2"
witness_module_sha256 = "8f9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b"
witness_expected_outcome = "rejected"
witness_required_rejection_kind = "type_mismatch"

[formal_kernel_witnesses.W-SI71-01.mutation_recipe]
strategy = "mutate_constant"
target_symbol = "abs_bound"
target_position = "postcondition"
params = { original = "0.4", mutated = "0.001" }

